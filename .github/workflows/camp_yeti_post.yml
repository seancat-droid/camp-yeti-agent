# Runs Camp Yeti's poster on a schedule.
#
# Set repo secrets (Settings -> Secrets and variables -> Actions):
#   ANTHROPIC_API_KEY
#   BLOTATO_API_KEY
#   BLOTATO_INSTAGRAM_ACCOUNT_ID

name: camp-yeti-post

on:
  schedule:
    # Runs Mon/Wed/Fri at 16:00 UTC -- adjust to taste, cron is UTC
    - cron: "0 16 * * 1,3,5"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate and publish post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          BLOTATO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.BLOTATO_INSTAGRAM_ACCOUNT_ID }}
        run: python camp_yeti_poster.py

      # The script edits the persona bible's continuity log locally --
      # commit that change back so the next run sees it.
      - name: Commit updated continuity log
        run: |
          git config user.name "camp-yeti-bot"
          git config user.email "actions@github.com"
          git add camp_yeti_persona_bible.md
          git diff --staged --quiet || git commit -m "Update continuity log"
          git push
