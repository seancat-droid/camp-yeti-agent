# Runs Camp Yeti's poster on a schedule.
#
# Set repo secrets (Settings -> Secrets and variables -> Actions):
#   ANTHROPIC_API_KEY
#   BLOTATO_API_KEY
#   BLOTATO_INSTAGRAM_ACCOUNT_ID

name: camp-yeti-post

on:
  schedule:
    # Fires daily at 16:00 UTC, but camp_yeti_poster.py itself decides
    # whether today is actually a posting day -- it alternates 2-day and
    # 3-day gaps between posts (not a fixed interval) to read as less
    # mechanical and build some suspense, rather than posting like
    # clockwork. Cron's day-of-month math can't express an alternating
    # gap cleanly, so the daily trigger + in-script gate is more reliable.
    - cron: "0 16 * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests Pillow librosa
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate and publish post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          BLOTATO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.BLOTATO_INSTAGRAM_ACCOUNT_ID }}
        run: python camp_yeti_poster.py

      # The script edits the persona bible's continuity log and the
      # posting-cadence state file locally -- commit those back so the
      # next run sees them. On a skip day neither file changes, so this
      # is a harmless no-op.
      - name: Commit updated continuity log and posting state
        run: |
          git config user.name "camp-yeti-bot"
          git config user.email "actions@github.com"
          git add camp_yeti_persona_bible.md posting_state.json
          git diff --staged --quiet || git commit -m "Update continuity log and posting state"
          git push
